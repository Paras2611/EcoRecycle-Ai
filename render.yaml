services:
  - type: web
    name: ecorecycle-backend
    env: python
    region: singapore
    plan: free

    buildCommand: pip install -r backend/requirements.txt

    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/v1/health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecorecycle-db
          property: connectionString

      - key: PYTHON_VERSION
        value: 3.11.8

databases:
  - name: ecorecycle-db
    plan: free
    region: singapore